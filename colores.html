<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UtilMooz - Herramientas de Colores</title>
<meta name="description" content="Color Picker, conversor HEX RGB HSL, contraste WCAG, gradientes y generadores CSS gratis.">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
header,footer{background:#111827;color:#fff}
header{padding:20px}
footer{padding:25px;text-align:center;color:#aaa}
.wrap{max-width:1100px;margin:auto}
.logo{font-size:28px;font-weight:bold}
.logo span{color:#4f8cff}
main{max-width:1000px;margin:40px auto;padding:0 20px}
h1{font-size:36px;margin-bottom:10px}
.desc{color:#667085;margin-bottom:25px;line-height:1.6}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:25px}
.tool{background:#fff;border:1px solid #ddd;border-radius:10px;padding:14px;cursor:pointer;transition:.2s}
.tool:hover{box-shadow:0 4px 10px rgba(0,0,0,.08)}
.tool.active{border:2px solid #4f8cff}
.panel{background:#fff;border:1px solid #ddd;border-radius:14px;padding:25px;box-shadow:0 8px 20px rgba(0,0,0,.05)}
.panel h2{margin-bottom:8px}
.panel p{color:#667085;margin-bottom:15px}
input,button{width:100%;padding:12px;border-radius:8px;font-size:15px;margin:8px 0}
input{border:1px solid #d6dbe6}
input[type=color]{height:60px;padding:4px}
input[type=range]{padding:0}
button{background:#4f8cff;color:#fff;border:none;cursor:pointer}
button:hover{background:#3978e8}
.result{background:#eef3ff;padding:18px;border-radius:10px;margin-top:15px}
.color-box{height:120px;border-radius:10px;border:1px solid #ccc;margin:12px 0}
.code{background:#111827;color:#fff;padding:12px;border-radius:8px;font-family:monospace;white-space:pre-wrap;margin:10px 0}
.range{text-align:center;color:#4f8cff;font-weight:bold;margin-top:-5px}
.big{font-size:42px;font-weight:bold}
</style>
</head>
<body>

<header>
<div class="wrap">
<div class="logo">Util<span>Mooz</span></div>
</div>
</header>

<main>
<h1>Herramientas de Colores</h1>
<p class="desc">
12 herramientas gratuitas para diseñadores y desarrolladores. Convertí colores, comprobá contraste y generá código CSS al instante.
</p>

<div class="tools" id="tools"></div>

<div class="panel">
<h2 id="title">Color Picker</h2>
<p id="description">Elegí un color.</p>

<div id="form"></div>

<div class="result" id="result">
Esperando...
</div>
</div>
</main>

<footer>© 2026 UtilMooz — Herramientas online</footer>

<script>
const toolList=[
["picker","🎨 Color Picker"],
["hexrgb","HEX → RGB"],
["rgbhex","RGB → HEX"],
["hexhsl","HEX → HSL"],
["hslhex","HSL → HEX"],
["contrast","⚫ Contraste"],
["comp","🔄 Complementario"],
["triad","🎨 Triádico"],
["grad","🌈 Gradiente"],
["shadow","🌑 Box Shadow"],
["radius","⭕ Border Radius"],
["text","✏️ Text Shadow"]
];

const configs={
picker:["Elegí un color.",`<input type=color id=color value="#4f8cff"><button onclick="picker()">Analizar color</button>`],
hexrgb:["Convertí HEX a RGB.",`<input id=hex placeholder="#4f8cff"><button onclick="hexRGB()">Convertir</button>`],
rgbhex:["Convertí RGB a HEX.",`<input id=r type=number placeholder="Rojo"><input id=g type=number placeholder="Verde"><input id=b type=number placeholder="Azul"><button onclick="rgbHEX()">Convertir</button>`],
hexhsl:["Convertí HEX a HSL.",`<input id=hex placeholder="#4f8cff"><button onclick="hexHSL()">Convertir</button>`],
hslhex:["Convertí HSL a HEX.",`<input id=h type=number placeholder="Hue"><input id=s type=number placeholder="Saturation"><input id=l type=number placeholder="Lightness"><button onclick="hslHEX()">Convertir</button>`],
contrast:["Contraste WCAG.",`<label>Color 1</label><input type=color id=c1 value="#000000"><label>Color 2</label><input type=color id=c2 value="#ffffff"><button onclick="contrast()">Comprobar</button>`],
comp:["Color complementario.",`<input type=color id=color value="#4f8cff"><button onclick="complementario()">Generar</button>`],
triad:["Paleta triádica.",`<input type=color id=color value="#4f8cff"><button onclick="triadico()">Generar</button>`],
grad:["Generador de gradientes CSS.",`<label>Color 1</label><input type=color id=c1 value="#4f8cff"><label>Color 2</label><input type=color id=c2 value="#111827"><label>Ángulo</label><input id=ang type=range min=0 max=360 value=90 oninput="av.innerText=this.value"><div class=range id=av>90</div><button onclick="gradiente()">Generar CSS</button>`],
shadow:["Generador Box Shadow.",`<label>X</label><input id=x type=range min=-30 max=30 value=5 oninput="vx.innerText=this.value;shadow()"><div class=range id=vx>5</div><label>Y</label><input id=y type=range min=-30 max=30 value=5 oninput="vy.innerText=this.value;shadow()"><div class=range id=vy>5</div><label>Blur</label><input id=blur type=range min=0 max=50 value=15 oninput="vb.innerText=this.value;shadow()"><div class=range id=vb>15</div><label>Color</label><input type=color id=sc value="#000000" oninput="shadow()">`],
radius:["Generador Border Radius.",`<input id=rad type=range min=0 max=100 value=12 oninput="vr.innerText=this.value;radius()"><div class=range id=vr>12</div>`],
text:["Generador Text Shadow.",`<label>X</label><input id=tx type=range min=-20 max=20 value=2 oninput="tvx.innerText=this.value;textshadow()"><div class=range id=tvx>2</div><label>Y</label><input id=ty type=range min=-20 max=20 value=2 oninput="tvy.innerText=this.value;textshadow()"><div class=range id=tvy>2</div><label>Blur</label><input id=tb type=range min=0 max=30 value=5 oninput="tvb.innerText=this.value;textshadow()"><div class=range id=tvb>5</div><label>Color</label><input type=color id=tc value="#000000" oninput="textshadow()">`]
};

const tools=document.getElementById("tools");
toolList.forEach((t,i)=>{
const div=document.createElement("div");
div.className="tool"+(i===0?" active":"");
div.innerHTML="<b>"+t[1]+"</b>";
div.onclick=()=>selectTool(t[0],div);
tools.appendChild(div);
});

function selectTool(name,el){
document.querySelectorAll(".tool").forEach(x=>x.classList.remove("active"));
el.classList.add("active");
title.innerText=toolList.find(t=>t[0]===name)[1];
description.innerText=configs[name][0];
form.innerHTML=configs[name][1];
result.innerHTML="Esperando...";
if(name==="picker")picker();
if(name==="shadow")shadow();
if(name==="radius")radius();
if(name==="text")textshadow();
}

function hexToRGB(hex){
hex=hex.replace("#","");
return{
r:parseInt(hex.substring(0,2),16),
g:parseInt(hex.substring(2,4),16),
b:parseInt(hex.substring(4,6),16)
};
}

function rgbToHSL(r,g,b){
r/=255; g/=255; b/=255;
const max=Math.max(r,g,b), min=Math.min(r,g,b);
let h=0,s=0;
const l=(max+min)/2;
if(max!==min){
const d=max-min;
s=l>0.5? d/(2-max-min): d/(max+min);
switch(max){
case r: h=(g-b)/d+(g<b?6:0); break;
case g: h=(b-r)/d+2; break;
case b: h=(r-g)/d+4; break;
}
h/=6;
}
return[Math.round(h*360),Math.round(s*100),Math.round(l*100)];
}

function hslToRGB(h,s,l){
s/=100; l/=100;
const c=(1-Math.abs(2*l-1))*s;
const x=c*(1-Math.abs((h/60)%2-1));
const m=l-c/2;
let r=0,g=0,b=0;
if(h<60){r=c;g=x}
else if(h<120){r=x;g=c}
else if(h<180){g=c;b=x}
else if(h<240){g=x;b=c}
else if(h<300){r=x;b=c}
else{r=c;b=x}
return{
r:Math.round((r+m)*255),
g:Math.round((g+m)*255),
b:Math.round((b+m)*255)
};
}

function mostrar(txt){result.innerHTML=txt}

function copiar(txt){
navigator.clipboard.writeText(txt);
alert("CSS copiado");
}

function picker(){
const color=document.getElementById("color").value;
const rgb=hexToRGB(color);
const hsl=rgbToHSL(rgb.r,rgb.g,rgb.b);
mostrar(`<div class=color-box style="background:${color}"></div>
<b>HEX:</b> ${color}<br>
<b>RGB:</b> rgb(${rgb.r}, ${rgb.g}, ${rgb.b})<br>
<b>HSL:</b> hsl(${hsl[0]}, ${hsl[1]}%, ${hsl[2]}%)`);
}

function hexRGB(){
const h=hex.value.replace("#","");
if(!/^[0-9A-Fa-f]{6}$/.test(h)) return mostrar("HEX inválido.");
const c=hexToRGB(h);
mostrar(`<b>RGB:</b> rgb(${c.r}, ${c.g}, ${c.b})`);
}

function rgbHEX(){
const R=+r.value,G=+g.value,B=+b.value;
if([R,G,B].some(v=>isNaN(v)||v<0||v>255)) return mostrar("RGB inválido.");
const hex="#"+[R,G,B].map(v=>v.toString(16).padStart(2,"0")).join("").toUpperCase();
mostrar(`<b>HEX:</b> ${hex}`);
}

function hexHSL(){
const h=hex.value;
if(!/^#?[0-9A-Fa-f]{6}$/.test(h)) return mostrar("HEX inválido.");
const c=hexToRGB(h);
const o=rgbToHSL(c.r,c.g,c.b);
mostrar(`<b>HSL:</b> hsl(${o[0]}, ${o[1]}%, ${o[2]}%)`);
}

function hslHEX(){
const c=hslToRGB(+h.value,+s.value,+l.value);
const hex="#"+[c.r,c.g,c.b].map(v=>v.toString(16).padStart(2,"0")).join("").toUpperCase();
mostrar(`<b>HEX:</b> ${hex}`);
}

function luminancia(hex){
const c=hexToRGB(hex);
const v=[c.r,c.g,c.b].map(x=>{
x/=255;
return x<=0.03928?x/12.92:Math.pow((x+0.055)/1.055,2.4);
});
return 0.2126*v[0]+0.7152*v[1]+0.0722*v[2];
}

function contrast(){
const ratio=((Math.max(luminancia(c1.value),luminancia(c2.value))+0.05)/(Math.min(luminancia(c1.value),luminancia(c2.value))+0.05)).toFixed(2);
mostrar(`<b>Contraste: ${ratio}:1</b><br><br>
AA: ${ratio>=4.5?"✅ Cumple":"❌ No cumple"}<br>
AAA: ${ratio>=7?"✅ Cumple":"❌ No cumple"}`);
}

function complementario(){
const c=hexToRGB(color.value);
const comp="#"+[255-c.r,255-c.g,255-c.b].map(v=>v.toString(16).padStart(2,"0")).join("").toUpperCase();
mostrar(`<div class=color-box style="background:${comp}"></div><b>${comp}</b>`);
}

function triadico(){
const c=hexToRGB(color.value);
const hsl=rgbToHSL(c.r,c.g,c.b);
let html="";
[0,120,240].forEach(off=>{
const n=hslToRGB((hsl[0]+off)%360,hsl[1],hsl[2]);
const hex="#"+[n.r,n.g,n.b].map(v=>v.toString(16).padStart(2,"0")).join("").toUpperCase();
html+=`<div class=color-box style="background:${hex}"></div><b>${hex}</b><br>`;
});
mostrar(html);
}

function gradiente(){
const css=`background: linear-gradient(${ang.value}deg, ${c1.value}, ${c2.value});`;
mostrar(`<div class=color-box style="${css}"></div>
<div class=code>${css}</div>
<button onclick="copiar('${css}')">📋 Copiar CSS</button>`);
}

function shadow(){
const css=`box-shadow:${x.value}px ${y.value}px ${blur.value}px ${sc.value};`;
mostrar(`<div class=color-box style="background:#fff;${css}"></div>
<div class=code>${css}</div>
<button onclick="copiar('${css}')">📋 Copiar CSS</button>`);
}

function radius(){
const css=`border-radius:${rad.value}px;`;
mostrar(`<div class=color-box style="background:#4f8cff;${css}"></div>
<div class=code>${css}</div>
<button onclick="copiar('${css}')">📋 Copiar CSS</button>`);
}

function textshadow(){
const css=`text-shadow:${tx.value}px ${ty.value}px ${tb.value}px ${tc.value};`;
mostrar(`<div class="big" style="${css}">UtilMooz</div>
<div class=code>${css}</div>
<button onclick="copiar('${css}')">📋 Copiar CSS</button>`);
}

selectTool("picker",document.querySelector(".tool"));
</script>

</body>
</html>
