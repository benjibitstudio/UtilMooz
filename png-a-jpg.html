</p>


<div class="converter">

<input
type="file"

>


<label for="calidad">
Calidad JPG: <span id="valor">90</span>%
</label>

<input
type="range"
id="calidad"
min="10"
max="100"
value="90"
oninput="document.getElementById('valor').textContent=this.value"
>


<button onclick="convertir()">
Convertir a JPG
</button>


<div class="preview" id="preview"></div>

id="descargar"

⬇ Descargar JPG
</a>

</div>

</footer>


<script>

function convertir(){

const archivo=
document.getElementById("archivo").files[0];

const calidad=
parseInt(document.getElementById("calidad").value)/100;

const preview=
document.getElementById("preview");

const descargar=
document.getElementById("descargar");


if(!archivo){

preview.innerHTML=
"<p>Seleccioná una imagen PNG.</p>";

return;

}


const reader=
new FileReader();

reader.onload=function(e){

const img=
new Image();

img.onload=function(){

const canvas=
document.createElement("canvas");

canvas.width=img.width;
canvas.height=img.height;

const ctx=
canvas.getContext("2d");

ctx.fillStyle="#ffffff";
ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.drawImage(img,0,0);


const jpg=
canvas.toDataURL("image/jpeg",calidad);


preview.innerHTML=
'<img src="'+jpg+'" alt="Imagen JPG">';

descargar.href=jpg;

descargar.style.display="block";

};

img.src=e.target.result;

};

reader.readAsDataURL(archivo);

}

</script>
