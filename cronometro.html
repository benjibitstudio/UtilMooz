<main class="container">

<script>

let inicio=0;
let tiempoAcumulado=0;
let intervalo=null;

function actualizar(){

const ahora=Date.now();

const tiempo=tiempoAcumulado+(inicio?ahora-inicio:0);

const horas=Math.floor(tiempo/3600000);
const minutos=Math.floor((tiempo%3600000)/60000);
const segundos=Math.floor((tiempo%60000)/1000);
const centesimas=Math.floor((tiempo%1000)/10);

document.getElementById("tiempo").textContent=
String(horas).padStart(2,"0")+":"+
String(minutos).padStart(2,"0")+":"+
String(segundos).padStart(2,"0")+"."+
String(centesimas).padStart(2,"0");

}

function iniciar(){

if(intervalo)return;

inicio=Date.now();

intervalo=setInterval(actualizar,10);

}

function pausar(){

if(!intervalo)return;

tiempoAcumulado+=Date.now()-inicio;

inicio=0;

clearInterval(intervalo);
intervalo=null;

actualizar();

}

function reiniciar(){

clearInterval(intervalo);

intervalo=null;
inicio=0;
tiempoAcumulado=0;

document.getElementById("tiempo").textContent="00:00:00.00";
document.getElementById("vueltas").innerHTML="";

}

function vuelta(){

if(!intervalo)return;

const tiempo=document.getElementById("tiempo").textContent;

const elemento=document.createElement("div");

elemento.className="vuelta";
elemento.textContent="Vuelta: "+tiempo;

document.getElementById("vueltas").prepend(elemento);

}

</script>
